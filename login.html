<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Royal Restaurant Admin</title>
    <link rel="stylesheet" href="admin-theme.min.css">
    <link rel="stylesheet" href="login.min.css">
    <!-- Google Fonts: Cairo -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="fontawesome/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <!-- Supabase JS Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <!-- Login Container -->
    <div id="login-container" class="login-page">
        <div class="login-card">
            <div class="login-lang-wrapper">
                <button id="themeToggleBtn" class="theme-toggle-btn" type="button" title="تبديل الوضع">
                    <i class="fas fa-sun"></i>
                </button>
                <button id="adminLangBtn" class="lang-pill">
                    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
                    <span>EN</span>
                </button>
            </div>
            <div class="login-header">
                <img src="logo.png" alt="WebMakers Logo" class="admin-logo">
                <h1 data-ar="تسجيل الدخول" data-en="Sign In">Sign In</h1>
                <p data-ar="للمتابعة إلى بوابة الإدارة في منصة ويب ميكرز" data-en="To continue to the WebMakers Management Portal">To continue to the WebMakers Management Portal</p>
            </div>
            <form id="login-form" novalidate>
                <div class="form-group">
                    <label for="email"><i class="fas fa-user-circle"></i> <span data-ar="البريد الإلكتروني" data-en="Email">Email</span></label>
                    <input type="email" id="email" data-ar="أدخل البريد الإلكتروني" data-en="Enter your email" placeholder="Enter your email" required>
                </div>
                <div class="form-group">
                    <label for="password"><i class="fas fa-shield-alt"></i> <span data-ar="كلمة المرور" data-en="Password">Password</span></label>
                    <div class="password-wrapper">
                        <input type="password" id="password" data-ar="أدخل كلمة المرور" data-en="Enter your password" placeholder="Enter your password" required>
                        <i class="fas fa-eye toggle-password" id="togglePassword"></i>
                    </div>
                </div>
                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox" id="remember">
                        <span data-ar="البقاء قيد تسجيل الدخول" data-en="Stay signed in">Stay signed in</span>
                    </label>
                    <a href="#" class="forgot-pass" data-ar="هل نسيت كلمة المرور؟" data-en="Forgot password?">Forgot password?</a>
                </div>
                <button type="submit" id="login-btn" data-ar="تسجيل الدخول" data-en="Sign In">Sign In</button>
                <p id="login-error" class="error-msg"></p>
            </form>

            <div class="login-footer">
                <p data-ar="تم التطوير بواسطة فريق ويب ميكرز التقني" data-en="Developed by WebMakers Technical Team">Developed by WebMakers Technical Team</p>
                <div class="footer-links">
                    <a href="privacy.html" data-ar="سياسة الخصوصية" data-en="Privacy Policy">Privacy Policy</a>
                    <span class="dot"></span>
                    <a href="help.html" data-ar="مركز المساعدة" data-en="Help Center">Help Center</a>
                </div>
            </div>
        </div>
    </div>

    <!-- Custom Password Reset Modal -->
    <div id="reset-modal" class="modal-overlay" style="display: none;">
        <div class="modal-card">
            <h2 data-ar="استعادة كلمة المرور" data-en="Reset Password">Reset Password</h2>
            <p data-ar="أدخل بريدك الإداري وسنرسل لك رابط الاستعادة." data-en="Enter your admin email and we'll send a reset link.">Enter your admin email and we'll send a reset link.</p>
            <div class="form-group">
                <input type="email" id="reset-email" data-ar="البريد الإلكتروني" data-en="Email Address" placeholder="Email Address">
            </div>
            <div class="modal-actions">
                <button id="confirmReset" class="btn-gold" data-ar="إرسال الرابط" data-en="Send Link">Send Link</button>
                <button id="cancelReset" class="btn-outline" data-ar="إلغاء" data-en="Cancel">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Custom Toast Notification Container -->
    <div id="toast-container" class="toast-container"></div>

    <script src="login.min.js"></script>
    <script>
        // Theme Toggle Functionality
        (function() {
            const themeBtn = document.getElementById('themeToggleBtn');
            function applyTheme(theme) {
                document.documentElement.setAttribute('data-theme', theme);
                if (theme === 'light') {
                    document.body.classList.add('light-mode');
                    if (themeBtn) themeBtn.innerHTML = '<i class="fas fa-moon"></i>';
                } else {
                    document.body.classList.remove('light-mode');
                    if (themeBtn) themeBtn.innerHTML = '<i class="fas fa-sun"></i>';
                }
                localStorage.setItem('adminTheme', theme);
            }

            const savedTheme = localStorage.getItem('adminTheme') || 'dark';
            applyTheme(savedTheme);

            if (themeBtn) {
                themeBtn.addEventListener('click', function() {
                    const currentTheme = document.documentElement.getAttribute('data-theme') || 'dark';
                    applyTheme(currentTheme === 'dark' ? 'light' : 'dark');
                });
            }
        })();
    </script>
</body>
</html>
